<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Học Code JS Trên Android</title>
                <style>
                        /* Thêm tí CSS cho giao diện trên điện thoại nhìn xịn sò nhé */
                                body {
                                            font-family: Arial, sans-serif;
                                                        text-align: center;
                                                                    padding: 20px;
                                                                                background-color: #f0f2f5;
                                                                                        }
                                                                                                button {
                                                                                                            padding: 12px 24px;
                                                                                                                        font-size: 16px;
                                                                                                                                    background-color: #007bff;
                                                                                                                                                color: white;
                                                                                                                                                            border: none;
                                                                                                                                                                        border-radius: 8px;
                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                                                                                                                                                                                                        }
                                                                                                                                                                                                                button:active {
                                                                                                                                                                                                                            background-color: #0056b3; /* Tạo hiệu ứng khi nhấn trên màn hình cảm ứng */
                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                            #ketQua {
                                                                                                                                                                                                                                                        margin-top: 20px;
                                                                                                                                                                                                                                                                    font-size: 18px;
                                                                                                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                                                                                                            color: #333;
                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                            <h1>Chào mừng bạn đến với JavaScript!</h1>
                                                                                                                                                                                                                                                                                                                <p>Bấm vào nút bên dưới để kích hoạt đoạn script:</p>
                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                        <button id="nutBam">Bấm Vào Đây</button>

                                                                                                                                                                                                                                                                                                                            <div id="ketQua"></div>

                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                        // 1. Tạo một thông báo nhảy ra màn hình khi vừa tải trang xong
                                                                                                                                                                                                                                                                                                                                                console.log("File HTML và JS đã tải thành công!");

                                                                                                                                                                                                                                                                                                                                                        // 2. Lấy các phần tử HTML bằng JS
                                                                                                                                                                                                                                                                                                                                                                const nut = document.getElementById("nutBam");
                                                                                                                                                                                                                                                                                                                                                                        const vungKetQua = document.getElementById("ketQua");

                                                                                                                                                                                                                                                                                                                                                                                // 3. Lắng nghe sự kiện người dùng click (hoặc chạm vào nút trên Android)
                                                                                                                                                                                                                                                                                                                                                                                        nut.addEventListener("click", function() {
                                                                                                                                                                                                                                                                                                                                                                                                    // Hiển thị một cái hộp thông báo (Alert) trên điện thoại
                                                                                                                                                                                                                                                                                                                                                                                                                alert("Bạn vừa bấm nút thành công trên Android!");

                                                                                                                                                                                                                                                                                                                                                                                                                            // Thay đổi nội dung chữ của thẻ div#ketQua
                                                                                                                                                                                                                                                                                                                                                                                                                                        vungKetQua.innerHTML = "🎉 Tuyệt vời! Code JS đã chạy lúc: " + new Date().toLocaleTimeString();
                                                                                                                                                                                                                                                                                                                                                                                                                                                    vungKetQua.style.color = "#28a745"; // Đổi chữ sang màu xanh lá
                                                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
